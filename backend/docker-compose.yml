services:
  backend:
    # Restarts after a crash or host reboot. The image HEALTHCHECK polls /health.
    restart: unless-stopped
    # VM-local backend/.env (not committed) supplies artifact paths and ops settings.
    env_file:
      - path: .env
        required: false
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DMT_ARTIFACT_DIR: ${DMT_ARTIFACT_DIR:-/backend/runtime-artifacts}
      DMT_ARTIFACT_MANIFEST: ${DMT_ARTIFACT_MANIFEST:-/backend/runtime-artifacts/manifest.json}
      DMT_ARTIFACT_REQUIRED: ${DMT_ARTIFACT_REQUIRED:-true}
      DMT_MESA_COVERAGE_REQUIRED: ${DMT_MESA_COVERAGE_REQUIRED:-false}
      DMT_EXPECTED_COVERAGE_RELEASE_ID: ${DMT_EXPECTED_COVERAGE_RELEASE_ID:-}
      DMT_EXPECTED_COVERAGE_CONTRACT_SHA256: ${DMT_EXPECTED_COVERAGE_CONTRACT_SHA256:-}
      DMT_SOLUTION_CACHE_DIR: ${DMT_SOLUTION_CACHE_DIR:-/backend/runtime-cache/solutions}
      DMT_CUSTOM_POLYGON_JOB_DB: ${DMT_CUSTOM_POLYGON_JOB_DB:-/backend/runtime-cache/jobs.sqlite3}
      DMT_OPS_TOKEN: ${DMT_OPS_TOKEN:-}
      DMT_MAX_POLYGON_VERTICES: ${DMT_MAX_POLYGON_VERTICES:-5000}
      DMT_MAX_POLYGON_AREA_KM2: ${DMT_MAX_POLYGON_AREA_KM2:-2200000}
      DMT_RATE_LIMIT_PER_MINUTE: ${DMT_RATE_LIMIT_PER_MINUTE:-30}
      MANIFEST_BLOB_URL: ${MANIFEST_BLOB_URL:-https://aagibolq28slyfof.public.blob.vercel-storage.com/releases/catalog-v3-2-0/manifest.json}
      DMT_MANIFEST_URL: ${DMT_MANIFEST_URL:-https://aagibolq28slyfof.public.blob.vercel-storage.com/releases/catalog-v3-2-0/manifest.json}
    ports:
      - "8000:8000"
    volumes:
      - ./runtime-artifacts:/backend/runtime-artifacts
      - ./runtime-cache:/backend/runtime-cache
      # Service-account key files (not committed). Point the *_SERVICE_ACCOUNT_FILE
      # names in backend/.env at /run/secrets/dmt/<file>.
      - ./secrets:/run/secrets/dmt:ro
