<app-shell id="foundation-app-shell">
  <section
    id="foundation-left-sidebar-slot"
    slot-left
    class="h-full p-3 text-sm text-ink-900"
  >
    <h2 id="foundation-left-sidebar-title" class="mb-2 text-base font-semibold">
      Left Sidebar
    </h2>
    <p id="foundation-left-sidebar-description">
      Placeholder container for solution controls.
    </p>
  </section>

  <section id="foundation-center-slot" slot-center class="h-full p-3 md:p-4">
    <h1 id="map-panel-title" class="sr-only">{{ title() }}</h1>
    <arcgis-map
      id="foundation-map-view"
      class="h-full rounded-panel border border-earth-300 shadow-sm"
      basemap="streets-navigation-vector"
      center="-74.0721,4.7110"
      zoom="6"
    ></arcgis-map>
  </section>

  <section
    id="foundation-right-sidebar-slot"
    slot-right
    class="h-full p-3 text-sm text-ink-900"
  >
    <h2 id="foundation-right-sidebar-title" class="mb-2 text-base font-semibold">
      Right Sidebar
    </h2>
    <p id="foundation-right-sidebar-description">
      Placeholder container for analysis dashboards.
    </p>
  </section>
</app-shell>
<router-outlet id="app-router-outlet"></router-outlet>
