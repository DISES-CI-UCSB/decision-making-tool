<section id="map-view-root" class="relative h-full w-full min-w-0 min-h-[320px]">
  <div id="map-view-container" #mapViewContainer class="h-full w-full"></div>
  @if (mapErrorMessage) {
    <div
      id="map-view-error-banner"
      class="absolute bottom-2 left-2 z-10 rounded bg-red-600 px-3 py-2 text-xs text-white"
    >
      {{ mapErrorMessage }}
    </div>
  }
</section>
