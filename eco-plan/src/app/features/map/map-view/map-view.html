<section id="map-view-root" class="relative h-full w-full min-w-0 min-h-[320px]">
  <div id="map-view-container" #mapViewContainer class="h-full w-full"></div>

  <section
    id="map-view-custom-zoom-controls"
    class="pointer-events-none absolute right-3 top-3 z-10 flex flex-col overflow-hidden rounded-xl border border-slate-200 bg-white/95 shadow-sm"
    aria-label="Map zoom controls"
  >
    <button
      id="map-view-custom-zoom-in-button"
      type="button"
      class="pointer-events-auto h-9 w-9 border-b border-slate-200 text-lg font-semibold leading-none text-slate-700 transition hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
      aria-label="Zoom in"
      (click)="zoomIn()"
    >
      +
    </button>
    <button
      id="map-view-custom-zoom-out-button"
      type="button"
      class="pointer-events-auto h-9 w-9 text-xl font-semibold leading-none text-slate-700 transition hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
      aria-label="Zoom out"
      (click)="zoomOut()"
    >
      —
    </button>
  </section>

  @if (mapErrorMessage) {
    <div
      id="map-view-error-banner"
      class="absolute bottom-2 left-2 z-10 rounded bg-red-600 px-3 py-2 text-xs text-white"
    >
      {{ mapErrorMessage }}
    </div>
  }
</section>
