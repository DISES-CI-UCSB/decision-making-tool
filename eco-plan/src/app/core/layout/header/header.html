<header
  id="foundation-header-container"
  class="flex items-center justify-between border-b border-slate-200 bg-white/95 px-4 py-2 backdrop-blur"
>
  <h1 id="foundation-header-title" class="text-base font-semibold tracking-tight text-slate-900">
    {{ 'header.appTitle' | translate }}
  </h1>

  <button
    id="foundation-header-language-toggle-button"
    type="button"
    class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:ring-offset-2"
    (click)="toggleLanguage()"
  >
    {{ 'header.languageToggleLabel' | translate: { lang: activeLanguage === 'es' ? 'EN' : 'ES' } }}
  </button>
</header>
