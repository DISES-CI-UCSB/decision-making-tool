<main id="app-shell-main" class="h-screen bg-slate-100 text-slate-900">
  <section
    id="app-shell-mobile-layout"
    class="flex h-full flex-col md:hidden"
    [class.hidden]="!isMobileViewport"
  >
    <header
      id="app-shell-mobile-header"
      class="flex items-center justify-between border-b border-slate-200 bg-white px-3 py-2"
    >
      <button
        id="app-shell-mobile-left-drawer-toggle"
        type="button"
        class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
        (click)="openLeftDrawer()"
      >
        {{ 'layout.mobile.leftPanelButton' | translate }}
      </button>
      <h1 id="app-shell-mobile-title" class="text-sm font-semibold">
        {{ 'layout.mobile.shellTitle' | translate }}
      </h1>
      <button
        id="app-shell-mobile-right-drawer-toggle"
        type="button"
        class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
        (click)="openRightDrawer()"
      >
        {{ 'layout.mobile.rightPanelButton' | translate }}
      </button>
    </header>

    <section id="app-shell-mobile-center-pane" class="h-[calc(100%-3rem)] min-h-0">
      <ng-content select="[data-slot='center']"></ng-content>
    </section>

    <div
      id="app-shell-mobile-overlay"
      class="fixed inset-0 z-30 bg-black/30"
      tabindex="0"
      [class.hidden]="!leftDrawerOpen && !rightDrawerOpen"
      (click)="closeMobileDrawers()"
      (keydown.enter)="closeMobileDrawers()"
      (keydown.space)="closeMobileDrawers()"
    ></div>

    <aside
      id="app-shell-mobile-left-drawer"
      class="fixed left-0 top-0 z-40 h-full w-80 max-w-[85vw] border-r border-slate-200 bg-white p-3 shadow-lg transition-transform duration-200"
      [class.-translate-x-full]="!leftDrawerOpen"
      [class.translate-x-0]="leftDrawerOpen"
    >
      <div id="app-shell-mobile-left-drawer-header" class="mb-3 flex justify-end">
        <button
          id="app-shell-mobile-left-drawer-close"
          type="button"
          class="rounded-xl border border-slate-200 px-3 py-1 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
          (click)="closeMobileDrawers()"
        >
          {{ 'common.close' | translate }}
        </button>
      </div>
      <section id="app-shell-mobile-left-drawer-content" class="h-[calc(100%-2.5rem)]">
        <ng-content select="[data-slot='left']"></ng-content>
      </section>
    </aside>

    <aside
      id="app-shell-mobile-right-drawer"
      class="fixed right-0 top-0 z-40 h-full w-80 max-w-[85vw] border-l border-slate-200 bg-white p-3 shadow-lg transition-transform duration-200"
      [class.translate-x-full]="!rightDrawerOpen"
      [class.translate-x-0]="rightDrawerOpen"
    >
      <div id="app-shell-mobile-right-drawer-header" class="mb-3 flex justify-end">
        <button
          id="app-shell-mobile-right-drawer-close"
          type="button"
          class="rounded-xl border border-slate-200 px-3 py-1 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
          (click)="closeMobileDrawers()"
        >
          {{ 'common.close' | translate }}
        </button>
      </div>
      <section id="app-shell-mobile-right-drawer-content" class="h-[calc(100%-2.5rem)]">
        <ng-content select="[data-slot='right']"></ng-content>
      </section>
    </aside>
  </section>

  <section
    id="app-shell-desktop-layout"
    class="hidden h-full md:grid"
    [style.gridTemplateColumns]="desktopGridTemplateColumns"
    [class.grid]="!isMobileViewport"
  >
    <aside
      id="app-shell-desktop-left-pane"
      class="min-w-0 overflow-auto border-r border-slate-200 bg-white"
    >
      @if (!leftCollapsed) {
        <div id="app-shell-desktop-left-pane-header" class="flex justify-end p-2">
          <button
            id="app-shell-desktop-left-collapse-toggle"
            type="button"
            class="rounded-xl border border-slate-200 bg-white px-3 py-1 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
            (click)="toggleLeftCollapse()"
          >
            {{ 'layout.desktop.collapse' | translate }}
          </button>
        </div>
        <section id="app-shell-desktop-left-pane-content" class="h-[calc(100%-2.75rem)]">
          <ng-content select="[data-slot='left']"></ng-content>
        </section>
      } @else {
        <section
          id="app-shell-desktop-left-icon-rail"
          class="flex h-full flex-col items-center justify-between gap-3 p-2"
        >
          <div
            id="app-shell-desktop-left-icon-rail-group"
            class="flex w-full flex-col items-center gap-2"
          >
            <button
              id="app-shell-desktop-left-rail-active-solution-button"
              type="button"
              class="flex h-11 w-11 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 transition hover:bg-slate-100"
              aria-label="Active solution section"
              title="Active solution section"
            >
              <svg
                id="app-shell-desktop-left-rail-active-solution-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                class="h-5 w-5"
                aria-hidden="true"
              >
                <path
                  d="M6 4h12a1 1 0 0 1 1 1v14l-3-2-3 2-3-2-3 2V5a1 1 0 0 1 1-1Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              id="app-shell-desktop-left-rail-data-layers-button"
              type="button"
              class="flex h-11 w-11 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 transition hover:bg-slate-100"
              aria-label="Data layers section"
              title="Data layers section"
            >
              <svg
                id="app-shell-desktop-left-rail-data-layers-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                class="h-5 w-5"
                aria-hidden="true"
              >
                <path
                  d="m4 8 8-4 8 4-8 4-8-4Zm0 4 8 4 8-4M4 16l8 4 8-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              id="app-shell-desktop-left-rail-actions-button"
              type="button"
              class="flex h-11 w-11 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 transition hover:bg-slate-100"
              aria-label="Actions section"
              title="Actions section"
            >
              <svg
                id="app-shell-desktop-left-rail-actions-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                class="h-5 w-5"
                aria-hidden="true"
              >
                <path
                  d="M12 3v3m0 12v3M4.6 6.2l2.1 2.1m10.6 10.6 2.1 2.1M3 12h3m12 0h3M4.6 17.8l2.1-2.1m10.6-10.6 2.1-2.1M12 9.5A2.5 2.5 0 1 1 12 14.5 2.5 2.5 0 0 1 12 9.5Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>

          <button
            id="app-shell-desktop-left-rail-expand-button"
            type="button"
            class="flex h-11 w-11 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 transition hover:bg-slate-100"
            (click)="toggleLeftCollapse()"
            [attr.aria-label]="'layout.desktop.expand' | translate"
            [attr.title]="'layout.desktop.expand' | translate"
          >
            <svg
              id="app-shell-desktop-left-rail-expand-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              class="h-5 w-5"
              aria-hidden="true"
            >
              <path
                d="M9 5 16 12 9 19"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </section>
      }
    </aside>

    <div
      id="app-shell-desktop-left-resize-handle"
      class="cursor-col-resize bg-slate-200 transition hover:bg-slate-300"
      [class.hidden]="leftCollapsed"
      (mousedown)="startResize('left', $event)"
    ></div>

    <section id="app-shell-desktop-center-pane" class="min-w-0 overflow-hidden bg-slate-100">
      <div
        id="app-shell-desktop-center-toolbar"
        class="flex justify-between border-b border-slate-200 bg-white/70 p-2"
      >
        <button
          id="app-shell-desktop-left-reopen-button"
          type="button"
          class="rounded-xl border border-slate-200 bg-white px-3 py-1 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
          [class.invisible]="!leftCollapsed"
          (click)="toggleLeftCollapse()"
        >
          {{ 'layout.desktop.showLeft' | translate }}
        </button>
        <button
          id="app-shell-desktop-right-reopen-button"
          type="button"
          class="rounded-xl border border-slate-200 bg-white px-3 py-1 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
          [class.invisible]="!rightCollapsed"
          (click)="toggleRightCollapse()"
        >
          {{ 'layout.desktop.showRight' | translate }}
        </button>
      </div>
      <section id="app-shell-desktop-center-pane-content" class="h-[calc(100%-3rem)] min-h-0">
        <ng-content select="[data-slot='center']"></ng-content>
      </section>
    </section>

    <div
      id="app-shell-desktop-right-resize-handle"
      class="cursor-col-resize bg-slate-200 transition hover:bg-slate-300"
      [class.hidden]="rightCollapsed"
      (mousedown)="startResize('right', $event)"
    ></div>

    <aside
      id="app-shell-desktop-right-pane"
      class="min-w-0 overflow-auto border-l border-slate-200 bg-white"
    >
      <div id="app-shell-desktop-right-pane-header" class="flex justify-start p-2">
        <button
          id="app-shell-desktop-right-collapse-toggle"
          type="button"
          class="rounded-xl border border-slate-200 bg-white px-3 py-1 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
          (click)="toggleRightCollapse()"
        >
          {{
            rightCollapsed
              ? ('layout.desktop.expand' | translate)
              : ('layout.desktop.collapse' | translate)
          }}
        </button>
      </div>
      <section
        id="app-shell-desktop-right-pane-content"
        class="h-[calc(100%-2.75rem)]"
        [class.hidden]="rightCollapsed"
      >
        <ng-content select="[data-slot='right']"></ng-content>
      </section>
    </aside>
  </section>
</main>
