services:
  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      # Build-time values come from frontend/.env (not committed). Empty values keep
      # the committed production Firebase config and catalog defaults.
      args:
        ENABLE_MANIFEST_EDITOR: "false"
        METRICS_API_BASE_URL: /metrics-api
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
        FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
        ACCESS_REQUEST_NOTIFICATION_EMAIL: ${ACCESS_REQUEST_NOTIFICATION_EMAIL:-}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        MANIFEST_BLOB_URL: ${MANIFEST_BLOB_URL:-}
        CATALOG_RELEASE_INDEX_BLOB_URL: ${CATALOG_RELEASE_INDEX_BLOB_URL:-https://aagibolq28slyfof.public.blob.vercel-storage.com/catalog-releases/3.7.1/catalog-release-index.json}
        SIRAP_MANIFEST_BLOB_URL: ${SIRAP_MANIFEST_BLOB_URL:-}
        BLOB_ASSET_PROXY_PATH: ${BLOB_ASSET_PROXY_PATH:-}
    environment:
      # nginx proxies /metrics-api/ here at request time. The default only resolves on a
      # Compose network that also runs the backend; point it at the backend's URL otherwise.
      METRICS_API_UPSTREAM: ${METRICS_API_UPSTREAM:-http://backend:8000}
    ports:
      - "8080:8080"
