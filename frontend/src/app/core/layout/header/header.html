<header
  id="foundation-header-container"
  class="relative z-50 isolate flex items-center justify-between border-b border-slate-200 bg-white/95 px-4 py-2 backdrop-blur"
>
  <h1 id="foundation-header-title" class="text-base font-semibold tracking-tight text-slate-900">
    {{ 'header.appTitle' | translate }}
  </h1>

  <section id="foundation-header-controls" class="relative flex items-center gap-3 text-sm">
    <app-dev-tools-panel
      id="foundation-header-dev-tools-panel"
      [coordinateToolEnabled]="coordinateToolEnabled"
      (coordinateToolEnabledChange)="coordinateToolEnabledChange.emit($event)"
    ></app-dev-tools-panel>

    <nav
      id="foundation-header-language-toggle-nav"
      aria-label="Language switcher"
      class="inline-flex items-center text-sm"
    >
      @if (activeLanguage === 'es') {
        <button
          id="foundation-header-language-toggle-link-en"
          type="button"
          class="inline-flex min-h-10 cursor-pointer items-center rounded-md py-1 font-medium text-sky-700 underline-offset-2 transition hover:text-sky-800 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:ring-offset-2"
          (click)="toggleLanguage()"
        >
          EN
        </button>
        <span
          id="foundation-header-language-toggle-divider-es"
          class="px-1.5 text-slate-400"
          aria-hidden="true"
          >|</span
        >
        <span
          id="foundation-header-language-toggle-current-es"
          aria-current="page"
          class="font-semibold text-slate-900"
        >
          ES
        </span>
      } @else {
        <span
          id="foundation-header-language-toggle-current-en"
          aria-current="page"
          class="font-semibold text-slate-900"
        >
          EN
        </span>
        <span
          id="foundation-header-language-toggle-divider-en"
          class="px-1.5 text-slate-400"
          aria-hidden="true"
          >|</span
        >
        <button
          id="foundation-header-language-toggle-link-es"
          type="button"
          class="inline-flex min-h-10 cursor-pointer items-center rounded-md py-1 font-medium text-sky-700 underline-offset-2 transition hover:text-sky-800 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:ring-offset-2"
          (click)="toggleLanguage()"
        >
          ES
        </button>
      }
    </nav>

    <section id="foundation-header-auth-shell" class="relative flex items-center gap-2">
      @if (isAuthenticated()) {
        <p id="foundation-header-auth-tier-chip" class="text-[10px] text-slate-500">
          Tier {{ currentTier() }}
        </p>
        @if (isAdmin()) {
          <button
            id="foundation-header-admin-access-button"
            type="button"
            class="inline-flex min-h-10 items-center rounded-md border border-sky-300 bg-sky-50 px-3 py-1 text-xs font-semibold text-sky-700 transition hover:bg-sky-100"
            [attr.aria-expanded]="adminPanelOpen()"
            (click)="openAdminPanel()"
          >
            Admin access
          </button>
        }
        <button
          id="foundation-header-logout-button"
          type="button"
          class="inline-flex min-h-10 items-center rounded-md border border-slate-300 bg-white px-3 py-1 text-xs font-semibold text-slate-700 transition hover:bg-slate-50"
          (click)="logout()"
        >
          Logout
        </button>
      } @else {
        <button
          id="foundation-header-auth-toggle-button"
          type="button"
          class="inline-flex min-h-10 items-center rounded-md border border-slate-300 bg-white px-3 py-1 text-xs font-semibold text-slate-700 transition hover:bg-slate-50"
          [attr.aria-expanded]="authModalOpen()"
          (click)="openAuthModal()"
        >
          Login / Request Access
        </button>
      }
    </section>
  </section>
</header>

@if (authModalOpen() && !isAuthenticated()) {
  <app-auth-modal
    id="foundation-header-auth-modal"
    (closeRequested)="closeAuthModal()"
  ></app-auth-modal>
}

@if (adminPanelOpen() && isAdmin()) {
  <app-admin-access-requests-panel
    id="foundation-header-admin-access-panel"
    (closeRequested)="closeAdminPanel()"
  ></app-admin-access-requests-panel>
}
