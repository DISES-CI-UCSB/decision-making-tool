@if (isRendered) {
  <div
    [id]="rootId"
    tabindex="0"
    class="fixed inset-0 z-110 flex items-end justify-center bg-slate-900/70 px-4 py-2 transition-opacity duration-200 md:items-center md:py-3"
    [class.opacity-100]="isActive"
    [class.opacity-0]="!isActive"
    (click)="onBackdropClick($event)"
    (keydown)="onBackdropKeydown($event)"
  >
    <section
      #panelElement
      [id]="rootId + '-panel'"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="ariaLabelKey ? (ariaLabelKey | translate) : null"
      [attr.aria-labelledby]="titleKey ? rootId + '-title' : null"
      tabindex="-1"
      class="flex min-h-0 w-full flex-col overflow-hidden bg-white shadow-xl transition-all duration-200 ease-out focus:outline-none"
      [ngClass]="{
        'max-h-[85vh] max-w-3xl rounded-md border border-slate-200': mode === 'standard',
        'max-h-[92vh] max-w-[92vw] rounded-md border border-slate-200': mode === 'wide',
        'h-full max-h-full max-w-full rounded-none border-0': mode === 'full-screen',
        'translate-y-0 opacity-100': isActive,
        'translate-y-4 opacity-0': !isActive,
      }"
      (click)="$event.stopPropagation()"
      (keydown)="onPanelKeydown($event)"
    >
      @if (titleKey || showCloseButton) {
        <header
          [id]="rootId + '-header'"
          class="flex justify-between gap-3 border-b border-slate-200 bg-white"
          [class.px-4]="mode !== 'wide'"
          [class.py-3]="mode !== 'wide'"
          [class.px-6]="mode === 'wide'"
          [class.py-4]="mode === 'wide'"
          [class.items-center]="headerAlign === 'center'"
          [class.items-start]="headerAlign === 'start'"
        >
          <div [id]="rootId + '-header-leading'" class="min-w-0 flex-1">
            <ng-content select="[modal-shell-header-content]"></ng-content>
            @if (titleKey) {
              <h2 [id]="rootId + '-title'" class="text-base font-semibold text-ink-900">
                {{ titleKey | translate }}
              </h2>
            }
          </div>

          <div
            [id]="rootId + '-header-trailing'"
            class="flex shrink-0 gap-2"
            [class.items-center]="headerAlign === 'center'"
            [class.items-start]="headerAlign === 'start'"
          >
            <ng-content select="[modal-shell-header-actions]"></ng-content>

            @if (showCloseButton) {
              <button
                [id]="rootId + '-close-button'"
                type="button"
                [attr.aria-label]="'common.close' | translate"
                class="inline-flex h-10 w-10 items-center justify-center rounded-md border border-slate-200 bg-white text-slate-600 transition hover:bg-slate-50 hover:text-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:ring-offset-2"
                (click)="onCloseButtonClick()"
              >
                <svg
                  [id]="rootId + '-close-icon'"
                  aria-hidden="true"
                  viewBox="0 0 24 24"
                  class="h-5 w-5 fill-none stroke-current"
                >
                  <path d="M6 6L18 18" stroke-width="2.25" stroke-linecap="square" />
                  <path d="M18 6L6 18" stroke-width="2.25" stroke-linecap="square" />
                </svg>
              </button>
            }
          </div>
        </header>
      }

      <div
        [id]="rootId + '-content'"
        class="min-h-0 flex-1 overflow-auto"
        [class.h-[calc(100%-3.5rem)]]="mode === 'full-screen'"
        [class.p-4]="mode === 'standard'"
        [class.p-0]="mode === 'wide' || mode === 'full-screen'"
      >
        <ng-content></ng-content>
      </div>
    </section>
  </div>
}
